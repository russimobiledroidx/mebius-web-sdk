name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Abstraction guard
        run: pnpm check:abstraction

# The publish job was removed deliberately.
#
# It rebuilt the whole workspace on every push to main purely to decide, most
# of the time, that there was nothing to release — a full runner spun up per
# push for a `changeset publish` no-op. Releases here are infrequent and
# deliberate, so the CI minutes bought nothing that a person running one
# command at release time does not already do.
#
# To release: from main, with the version bumped and the build green,
#
#   pnpm install --frozen-lockfile
#   pnpm build
#   npm publish --workspace packages/<name> --access public
#
# (or `pnpm release` to go through changesets). Publishing needs an npm account
# with write access to the @mebius-io scope; `npm whoami` before you start.
#
# The `build` job above still runs on every push and PR, so nothing about the
# quality gate changed — only the unused release runner is gone.
